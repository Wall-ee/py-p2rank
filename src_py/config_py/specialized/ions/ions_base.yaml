# P2Rank Ion Binding Sites Base Configuration
_description: "Base configuration for ion binding site prediction"

# === Model Configuration ===
model: "ion_binding"
features: ["chem", "volsite", "bfactor", "protrusion"]

# === Path Configuration ===
dataset_base_dir: "../../p2rank-ions-data-rdk/"
output_base_dir: "../../p2rank-ions-results/"

# === Specialized Settings ===
predict_residues: false

# === Visualization ===
visualizations: false
vis_generate_proteins: false
vis_highlight_ligands: true

# === Execution ===
fail_fast: false
threads: 0  # auto-detect

# === Logging ===
log_level: "WARN"
log_to_file: true
delete_models: true
ploop_delete_runs: false
stats_collect_predictions: true
log_cases: true

# === Cache ===
cache_datasets: false
clear_sec_caches: false
clear_prim_caches: false

# === Advanced Statistics ===
selected_stats:
  - "_blank"
  - "DCA_4_0"
  - "DCA_4_2"
  - "DCA_4_10"
  - "DCA_4_99"
  - "point_AUPRC"
  - "point_AUC"
  - "point_MCC"
  - "point_F1"
  - "point_TPX"
  - "TIME_MINUTES"

# === Feature Extraction ===
average_feat_vectors: true
avg_weighted: true
atom_table_feat_keep_sgn: true
solvent_radius: 1.2781

# === Training ===
positive_point_ligand_distance: 5.1286
neutral_points_margin: 3.0
balance_class_weights: true
target_class_weight_ratio: 0.0684

# === Prediction ===
point_score_pow: 10.0
pred_point_threshold: 0.5678
pred_min_cluster_size: 1
extended_pocket_cutoff: 1.0

# === Classifier ===
classifier: "RandomForest"
rf_trees: 100
rf_bagsize: 55
rf_depth: 12

# === Features ===
residue_table_features: ["RAx"]
atom_table_features: ["atomicHydrophobicity"]

# === Feature Parameters ===
neighbourhood_radius: 5.9
protrusion_radius: 7.0
feat_pmass_radius: 7.0  # feature not used
ss_cloud_radius: 6.0    # feature not used

