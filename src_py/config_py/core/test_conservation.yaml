# P2Rank Conservation Test Configuration
_extends: "test_default"
_description: "Test configuration for conservation model - includes conservation features"

# === Model Configuration ===
model: "conservation_hmm"
features: ["chem", "volsite", "protrusion", "bfactor", "conservation"]

# === Conservation Features ===
load_conservation: true
conservation_files_pattern: "*.conservation"

# === Advanced Statistics ===
stats_collect_predictions: true
selected_stats:
  - "_blank"
  - "DCA_4_0"
  - "DCA_4_2" 
  - "DCA_4_10"
  - "DCA_4_99"
  - "point_AUPRC"
  - "point_AUC"
  - "point_MCC"
  - "point_F1"
  - "point_TPX"
  - "TIME_MINUTES"

