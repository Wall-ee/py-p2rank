# P2Rank Default Training Configuration
_extends: "base"
_description: "Training configuration for default model - optimized for model training"

# === Model Configuration ===
model: "default"
features: ["chem", "volsite", "protrusion", "bfactor"]

# === Path Configuration ===
dataset_base_dir: "../../p2rank-datasets"
output_base_dir: "../../p2rank-results/{version}"

# === Training Optimization ===
visualizations: false
delete_models: true
delete_vectors: true
max_train_instances: 0  # unlimited

# === Error Handling ===
fail_fast: false

# === Execution Parameters ===
seed: 42
loop: 1
out_prefix_date: false
crossval_threads: 1

# === Cache Configuration ===
cache_datasets: true
clear_prim_caches: false
clear_sec_caches: false

# === Feature Configuration ===
feature_importances: false

# === Output Configuration ===
output_only_stats: true
log_cases: true
log_to_console: false
log_level: "WARN"
log_to_file: true

# === Training Specific Parameters ===
ploop_delete_runs: true
ploop_zip_runs: true
zip_log_file: true

# === Training Algorithm Parameters ===
# Important: preserve behavior of original trained model
sample_negatives_from_decoys: true
atom_table_feat_keep_sgn: false  # preserve legacy behavior

# === Classifier Configuration ===
classifier: "RandomForest"  # Changed from FasterForest for consistency
rf_flatten: true
rf_flatten_as_legacy: true
rf_batch_prediction: true

